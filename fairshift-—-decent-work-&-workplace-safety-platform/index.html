    <script>
      window.addEventListener('unhandledrejection', function (event) {
        if (
          event &&
          event.reason &&
          typeof event.reason.message === 'string' &&
          event.reason.message.includes('WebSocket closed without opened')
        ) {
          event.preventDefault();
        }
      });
    </script>
